apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  interval: 15m
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "1.7.x"
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    clusterName: "uptoyou-eks-cluster"
    region: "ap-southeast-1"
    vpcId: ${vpc_Id} # injected from terraform output
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
      annotations:
        # 🔥 สำคัญ: ใส่ ARN ของ IAM Role ที่สร้างจาก Terraform
        eks.amazonaws.com/role-arn: ${alb_role_arn} # injected from terraform output
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
