apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./app/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure # ← รอให้ Sealed Secrets CRD พร้อมก่อน
    - name: external-secret # ← รอให้ External Secrets Controller พร้อมก่อน
    - name: database # ← รอให้ Database พร้อมก่อน
  timeout: 5m0s
