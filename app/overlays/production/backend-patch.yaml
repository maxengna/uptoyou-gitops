apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  labels:
    app: uptoyoushop
    tier: backend
  namespace: uptoyoushop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptoyoushop
  template:
    metadata:
      labels:
        app: uptoyoushop
    spec:
      containers:
        - name: backend-app
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "postgres-postgresql.uptoyoushop.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
