apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: uptoyoushop
spec:
  interval: 5m # ตรวจสอบทุก 5 นาที
  chart:
    spec:
      chart: postgresql # chart ชื่ออะไร
      version: "15.*" # เวอร์ชันไหน
      sourceRef:
        kind: HelmRepository
        name: bitnami # ดึงจาก repo ไหน
      interval: 1m
  values:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 16.4.0-debian-12-r14
    auth:
      existingSecret: uptoyoushop-secret
      secretKeys:
        adminPasswordKey: POSTGRES_PASSWORD
      username: "postgres"
      database: "uptoyoushop"
    global:
      storageClass: gp3

    primary:
      name: postgres-primary
      size: 2
      persistence:
        enabled: true
        storageClass: gp3
        size: 20Gi
        accessModes:
          - ReadWriteOnce
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    readReplicas:
      name: postgres-replica
      replicaCount: 0
      size: 2
      persistence:
        enabled: true
        storageClass: gp3
        size: 20Gi
        accessModes:
          - ReadWriteOnce
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
        namespace: uptoyoushop

    service:
      type: ClusterIP
      port: 5432

    networkPolicy:
      enabled: true

    rbac:
      create: true

    serviceAccount:
      create: true
      name: postgres
