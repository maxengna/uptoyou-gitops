apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: uptoyoushop
spec:
  interval: 5m
  chart:
    spec:
      chart: pgadmin4
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: runix # ต้องเพิ่ม repository นี้ด้วย
        namespace: uptoyoushop
      interval: 1m
  values:
    env:
      email: "admin@uptoyou.shop"
      password: "1234" # แนะนำให้ใช้ SealedSecret ในภายหลัง
    persistentVolume:
      enabled: true
      storageClass: gp3
      size: 1Gi
    service:
      type: ClusterIP
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: alb
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
      hosts:
        - host: pgadmin.uptoyou.shop
          paths:                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
            - path: /
              pathType: Prefix