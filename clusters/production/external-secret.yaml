apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secret
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/controllers/external-secrets-operator/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure # ← รอให้ infrastructure พร้อมก่อน
  wait: true # ← รอจนกว่า CRDs + Controllers จะพร้อมใช้งานจริง
  timeout: 5m0s
