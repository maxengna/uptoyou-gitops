apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-alloy
  values:
    controller:
      type: daemonset
    alloy:
      mounts:
        varlog: true
        dockercontainers: true
      securityContext:
        privileged: false
        runAsUser: 0

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
        